name: Knip

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "!apps/docs/**"
      - "!**/*.md"
      - "!**/*.mdx"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/knip.yml"

permissions:
  contents: read

concurrency:
  group: knip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Knip
        run: bunx turbo run knip --filter=web --filter=dashboard --filter=api --filter=console -- --reporter github-actions
