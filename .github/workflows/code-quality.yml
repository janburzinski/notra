name: Code quality

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PRs only run the checks their diff can affect; main pushes run everything
  # because they gate production releases.
  changes:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      infrastructure: ${{ steps.plan.outputs.infrastructure }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: github.event_name == 'pull_request'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Plan checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "$BASE_SHA"...HEAD | grep -q '^\.github/workflows/code-quality\.yml$'; then
            echo 'checks=["lint","tests","tests-sites-builder 1/2","tests-sites-builder 2/2","browser","build-api","build-apps","build-dashboard","typecheck"]' >> "$GITHUB_OUTPUT"
            echo 'builds=web console ui' >> "$GITHUB_OUTPUT"
            echo infrastructure=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          affected=$(TURBO_SCM_BASE="$BASE_SHA" bunx turbo@2.11.7 ls --affected --output=json | jq -c '[.packages.items[].name]')
          echo "Affected packages: $affected"
          has() { jq -e --arg p "$1" 'index($p) != null' <<< "$affected" > /dev/null; }
          checks='["lint"'
          if [ "$affected" != "[]" ] || grep -qE '^scripts/github/' <<< "$files"; then checks="$checks,\"tests\""; fi
          [ "$affected" != "[]" ] && checks="$checks,\"typecheck\""
          has @notra/sites-builder && checks="$checks,\"tests-sites-builder 1/2\",\"tests-sites-builder 2/2\""
          # menu-highlight builds both the dashboard and the web stylesheet.
          if has dashboard || has web; then checks="$checks,\"browser\""; fi
          has api && checks="$checks,\"build-api\""
          has dashboard && checks="$checks,\"build-dashboard\""
          # Small app builds share one job: each alone spent half its time on setup.
          builds=""
          # apps/blog is not a workspace, but its scripts/web-chrome.js is generated from web.
          if has web || grep -qE '^apps/blog/scripts/' <<< "$files"; then builds="$builds web"; fi
          has console && builds="$builds console"
          has ui && builds="$builds ui"
          [ -n "$builds" ] && checks="$checks,\"build-apps\""
          echo "checks=$checks]" >> "$GITHUB_OUTPUT"
          echo "builds=${builds# }" >> "$GITHUB_OUTPUT"
          if grep -qE '^(packages/db|packages/sites-server|packages/schemas)/|^packages/ai/src/integrations/linear|^(bun\.lock|package\.json)$' <<< "$files"; then
            echo infrastructure=true >> "$GITHUB_OUTPUT"
          else
            echo infrastructure=false >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Quality (${{ matrix.check }})
    needs: changes
    # 4 cores cost twice as much per minute, so only jobs they speed up about
    # 2x get them: tests run files in parallel, and type-aware lint peaks at
    # 8.7 GB, past the 2-core runner's 8 GB.
    runs-on: ${{ contains(fromJSON('["lint","tests"]'), matrix.check) && 'depot-ubuntu-24.04-4' || 'depot-ubuntu-24.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.changes.outputs.checks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.11.1

      # No package cache: restoring it took as long as a fresh install, and
      # saving it after a lockfile change added up to two minutes to lint.
      - name: Check Vercel installs
        if: matrix.check == 'build-apps' && contains(format(' {0} ', needs.changes.outputs.builds), ' web ')
        run: |
          for app in dashboard web ui agent; do
            echo "::group::Check $app Vercel install"
            (
              cd "apps/$app"
              bash -c "$(bun -p 'require("./vercel.json").installCommand')"
            )
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ultracite check
        if: matrix.check == 'lint'
        run: bun check

      # PRs test only packages their diff affects (plus dependents); main
      # pushes still run everything because they gate production releases.
      # Sites builder runs its real builds in its own job: it alone takes as
      # long as every other package together.
      - name: Run unit and integration tests
        if: matrix.check == 'tests'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            TURBO_SCM_BASE="$BASE_SHA" bun run test --force --log-order=stream --affected --concurrency=1 --filter='!@notra/sites-builder'
          else
            bun run test --force --log-order=stream --concurrency=1 --filter='!@notra/sites-builder'
          fi

      # Two machines, each running its files one at a time: the builds fail
      # under --parallel on one machine. tests/timings.json balances the shards
      # by measured duration (refresh with --update-timings).
      - name: Run sites builder tests
        if: startsWith(matrix.check, 'tests-sites-builder ')
        working-directory: apps/sites-builder
        env:
          SHARD: ${{ matrix.check }}
        run: bun run test --shard="${SHARD##* }" --timings=tests/timings.json

      - name: Install browser test runtime
        if: matrix.check == 'browser'
        working-directory: apps/dashboard
        run: bunx --no-install playwright install --with-deps --only-shell chromium

      - name: Run dashboard browser regressions
        if: matrix.check == 'browser'
        working-directory: apps/dashboard
        run: bun run test:browser

      # The ui build needs network access: it fetches fallback fonts from Google Fonts.
      - name: Verify ${{ needs.changes.outputs.builds }} builds
        if: matrix.check == 'build-apps'
        env:
          BUILDS: ${{ needs.changes.outputs.builds }}
        run: bun run build --concurrency=2 $(printf -- '--filter=%s ' $BUILDS)

      - name: Verify the blog's generated navbar and dither bundle
        if: matrix.check == 'build-apps' && contains(format(' {0} ', needs.changes.outputs.builds), ' web ')
        working-directory: apps/web
        run: bun run blog:chrome:check

      - name: Verify standalone API on Alpine Linux
        if: matrix.check == 'build-api'
        run: |
          docker build --platform linux/amd64 -f apps/api/Dockerfile -t notra-api-production .
          docker run --rm --network none \
            --mount type=bind,source="$PWD/apps/api/scripts/production-artifact.test.ts",target=/app/scripts/production-artifact.test.ts,readonly \
            --entrypoint bun notra-api-production test /app/scripts/production-artifact.test.ts

      - name: Verify dashboard Vercel build
        if: matrix.check == 'build-dashboard'
        working-directory: apps/dashboard
        env:
          VERCEL: "1"
        run: bun run build && bun run test:workflow-production

      - name: Restore incremental TypeScript state
        if: matrix.check == 'typecheck'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            apps/*/.cache/typecheck.tsbuildinfo
            packages/*/.cache/typecheck.tsbuildinfo
          key: typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/typescript-config/*.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/typescript-config/*.json') }}-

      # No filter: every workspace with a check-types script, including new ones.
      - name: Typecheck all workspaces
        if: matrix.check == 'typecheck'
        run: bun run check-types --concurrency=2

  infrastructure:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notra_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notra_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.11.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration journal
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run db:check --base="$MIGRATION_BASE_REF"

      - name: Replay migrations and verify rerun safety
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Test post history triggers on migrated schema
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: bun test ./tests/post-history.test.ts

      - name: Test Linear OAuth token refresh on migrated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: bun --no-env-file test packages/ai/src/integrations/linear-oauth.postgres.test.ts

      - name: Test Sites branch workflow and migration 0128 rolling compatibility
        env:
          SITES_BRANCH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: bun test packages/sites-server/tests/branch-workflow.test.ts packages/db/tests/sites-branch-migration.test.ts

      - name: Test content Git publishing migration 0129 rolling compatibility
        env:
          SITES_BRANCH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: bun test packages/db/tests/content-git-publishing-migration.test.ts

      # These suites only accept a database named notra_server_audit on
      # 127.0.0.1, so they cannot point at a shared or production database.
      - name: Create the Sites PostgreSQL test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notra_server_audit
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres notra_server_audit
          bun run db:migrate

      - name: Test Sites against real PostgreSQL
        env:
          SITES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notra_server_audit
        run: |
          bun test \
            packages/sites-server/tests \
            packages/db/tests/build-telemetry-postgres.test.ts \
            packages/db/tests/sites-tenant-integrity.test.ts \
            packages/geo-core/tests/site-project-delete.test.ts

  quality:
    if: always()
    needs: [changes, checks, infrastructure]
    runs-on: depot-ubuntu-24.04
    # Depot runner boot counts against this budget and can take several minutes.
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Require all quality checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$CHECKS_RESULT" = success
          [ "$INFRASTRUCTURE_RESULT" = success ] || [ "$INFRASTRUCTURE_RESULT" = skipped ]

      # The repository cannot require checks before merging, so a red main is
      # only noticed here. It also blocks production releases. A run cancelled
      # because a newer push superseded it is not red, so only real failures alert.
      - name: Alert Slack when main goes red
        if: failure() && github.event_name == 'push' && contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.GEO_SCAN_ALERT_WEBHOOK_URL || secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::GEO_SCAN_ALERT_WEBHOOK_URL is not set; no Slack alert sent."
            exit 0
          fi
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")') || failed=""
          details="Commit: \`${GITHUB_SHA::10}\` ${COMMIT_MESSAGE%%$'\n'*}"$'\n'"Failed: ${failed:-unknown}"$'\n'"Fix main before merging anything else."
          jq -n --arg details "$details" --arg url "$RUN_URL" '{
            text: ":rotating_light: main is red: Code quality failed",
            blocks: [
              { type: "section", text: { type: "mrkdwn", text: "*:rotating_light: main is red: Code quality failed*\n\($details)" } },
              { type: "actions", elements: [ { type: "button", text: { type: "plain_text", text: "Open run" }, url: $url } ] }
            ]
          }' | curl -fsS -X POST -H "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL" > /dev/null
