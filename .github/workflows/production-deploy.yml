name: Production deploy

on:
  schedule:
    - cron: "0 12,19 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check CI and report planned deployments without creating builds
        type: boolean
        default: false
      skip_sites_e2e:
        description: Deploy without the Sites E2E gate (emergency fixes only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'usenotra/notra'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Select release commit
        id: release
        timeout-minutes: 12
        run: node scripts/github/utils/release-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      # Cheap target checks run before the Sites E2E gate and its Box builds.
      - name: Preflight production targets before builds
        run: node scripts/github/production-deploy.mjs --preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 42c6313caca1b1ca404152304a463d64
          RELEASE_DIR: ${{ runner.temp }}/release
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_J0UtPqQdb8AdDMRkyvJuR8kM
          UNKEY_DEPLOY_ROOT_KEY: ${{ secrets.UNKEY_DEPLOY_ROOT_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}

  # The Sites E2E suite (real Upstash Box builds) gates every real release of
  # the selected commit instead of running on each pull request.
  sites-e2e:
    needs: release
    if: ${{ !inputs.dry_run && !inputs.skip_sites_e2e }}
    uses: ./.github/workflows/sites-e2e.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
    secrets: inherit

  deploy:
    needs: [release, sites-e2e]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' &&
      (needs.sites-e2e.result == 'success' || needs.sites-e2e.result == 'skipped') }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Setup Bun
        if: ${{ !inputs.dry_run }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Build and boot agents
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/release" "$RELEASE_SHA"
          cd "$RUNNER_TEMP/release"
          for app in agent onboarding-agent; do
            echo "::group::Build and boot $app"
            (
              cd "apps/$app"
              bash -c "$(bun -p 'require("./vercel.json").installCommand')"
              bun run build
              PORT=3200 node --no-experimental-require-module .output/server/index.mjs > boot.log 2>&1 &
              pid=$!
              trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
              for _ in $(seq 1 30); do
                if curl -sf http://127.0.0.1:3200/eve/v1/health; then
                  echo
                  exit 0
                fi
                sleep 1
              done
              echo "Agent did not become healthy"
              cat boot.log
              exit 1
            )
            echo "::endgroup::"
          done

      # @notra/db carries the migrator the release runs against the demo database.
      - name: Install sites toolchain, worker and demo migrator
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ runner.temp }}/release
        run: bun install --frozen-lockfile --filter '@notra/sites-builder...' --filter '@notra/sites...' --filter '@notra/db'

      - name: Deploy checked main commit
        run: node scripts/github/production-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 42c6313caca1b1ca404152304a463d64
          RELEASE_DIR: ${{ runner.temp }}/release
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_J0UtPqQdb8AdDMRkyvJuR8kM
          UNKEY_DEPLOY_ROOT_KEY: ${{ secrets.UNKEY_DEPLOY_ROOT_KEY }}
          DEMO_MIGRATION_DATABASE_URL: ${{ secrets.DEMO_MIGRATION_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}

  notify:
    needs: [release, sites-e2e, deploy]
    if: ${{ failure() }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Alert Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.GEO_SCAN_ALERT_WEBHOOK_URL || secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          RELEASE: ${{ needs.release.result }}
          SITES_E2E: ${{ needs.sites-e2e.result }}
          LIFECYCLE_FAILURES: ${{ needs.sites-e2e.outputs.lifecycle-failures }}
          BROWSER_FAILURES: ${{ needs.sites-e2e.outputs.browser-failures }}
          SHA: ${{ needs.release.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::GEO_SCAN_ALERT_WEBHOOK_URL is not set; no Slack alert sent."
            exit 0
          fi
          if [ "$SITES_E2E" = "failure" ]; then
            headline=":rotating_light: Production deploy blocked: Sites E2E failed"
          elif [ "$RELEASE" = "failure" ]; then
            headline=":warning: Production deploy skipped: no green release commit"
          else
            headline=":rotating_light: Production deploy failed"
          fi
          details="Commit: \`${SHA:-unknown}\`"
          for failures in "$LIFECYCLE_FAILURES" "$BROWSER_FAILURES"; do
            if [ -n "$failures" ]; then
              details="$details"$'\n'"$failures"
            fi
          done
          jq -n --arg headline "$headline" --arg details "$details" --arg url "$RUN_URL" '{
            text: $headline,
            blocks: [
              { type: "section", text: { type: "mrkdwn", text: "*\($headline)*\n\($details)" } },
              { type: "actions", elements: [ { type: "button", text: { type: "plain_text", text: "Open run" }, url: $url } ] }
            ]
          }' | curl -fsS -X POST -H "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL" > /dev/null
