name: Sites dev release

on:
  pull_request:
    paths:
      - .github/workflows/sites-dev-release.yml
      - apps/sites-builder/**
      - packages/sites-compiler/**
      - packages/sites-core/**
      - packages/typescript-config/**
      - package.json
      - bun.lock
      - bunfig.toml
      - patches/**
      - LICENSE
  push:
    branches: [main]
    paths:
      - .github/workflows/sites-dev-release.yml
      - apps/sites-builder/**
      - packages/sites-compiler/**
      - packages/sites-core/**
      - packages/typescript-config/**
      - package.json
      - bun.lock
      - bunfig.toml
      - patches/**
      - LICENSE
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested tarball to npm, main branch only
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sites-dev-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Ships npm 11.6.2, new enough for trusted publishing (>= 11.5.1).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          package-manager-cache: false

      # Skip lifecycle scripts so root prepare (Husky, Effect patch) stays out.
      - name: Install dependencies
        run: >-
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          --filter '@notra/sites-builder'
          --filter '@notra/sites-compiler'
          --filter '@notra/sites-core'

      - name: Test core and compiler
        run: bun --no-env-file test packages/sites-core/tests packages/sites-compiler/tests

      # Includes packaged-dev.test.ts, which packs the tarball and runs it
      # installed on Node and Bun. That tarball is what gets published.
      - name: Test renderer and packaged tarball
        working-directory: apps/sites-builder
        run: bun --no-env-file test tests

      - name: Dry-run npm publish
        working-directory: apps/sites-builder/.notra
        run: npm publish --dry-run --access public ./usenotra-sites-dev-*.tgz

      - name: Upload tested tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-dev
          path: apps/sites-builder/.notra/usenotra-sites-dev-*.tgz
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  publish:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish == true &&
      github.ref == 'refs/heads/main' && github.repository == 'usenotra/notra'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-sites-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          package-manager-cache: false

      - name: Download tested tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sites-dev

      # No checkout or rebuild: publish exactly what verify tested.
      - name: Publish with OIDC
        run: npm publish --ignore-scripts --access public --provenance ./usenotra-sites-dev-*.tgz
